name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install UV
        run: pip install uv
      - name: Install dependencies
        run: uv pip sync requirements.lock --system
      - name: Lint with Ruff
        run: ruff check . # Checks style/errors
      - name: Format with Ruff
        run: ruff format . --check # Enforces formatting
      - name: Run tests
        run: pytest # If you add tests
